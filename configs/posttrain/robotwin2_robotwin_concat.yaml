# Opt-in raw-camera concat path. Existing RoboTwin/mosaic defaults are unchanged.
includes:
  - robotwin2.yaml

selectors:
  mode: ${oc.env:WSP_MODE,auto}
  visual_prompt: none
  dataset_name: worldscape_lerobot_text

model:
  model_config:
    model:
      shape:
        actions_per_block: ${oc.decode:${oc.env:ACTION_HORIZON,24}}
        action_horizon: ${model.model_config.model.shape.actions_per_block}
      visual_memory:
        diffusion_view_layout: robotwin_concat
        vlm_preprocessing:
          mode: resize
          height: 160
          width: 320
      wam:
        core:
          parameters:
            frame_seqlen: 120
            num_action_per_block: ${model.model_config.model.shape.action_horizon}

noise_kernel:
  config:
    num_action_per_block: ${model.model_config.model.shape.action_horizon}
    action_horizon: ${model.model_config.model.shape.action_horizon}

batch_adapter:
  diffusion_view_layout: robotwin_concat
  vlm_preprocessing: ${model.model_config.model.visual_memory.vlm_preprocessing}

data_loader:
  # Only deterministic preprocessing is included in this recipe.
  augment_video: false
  dataset_kwargs:
    action_horizon: ${model.model_config.model.shape.action_horizon}
    cache_video_resize_width: null
    cache_video_resize_height: null
